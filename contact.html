<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact</title>
<meta name="description" content="Get in touch.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<main>
  <div class="page-hero wrap"><h1 style="font-size:clamp(2.1rem,4.6vw,3.4rem)">Contact us</h1><p class="lead">Questions, corrections or partnership ideas? Send a note.</p></div>
  <section style="padding-top:12px"><div class="wrap" style="max-width:640px">
    <form class="stack" id="cform">
      <input name="name" required placeholder="Your name" aria-label="Your name">
      <input name="email" type="email" required placeholder="Your email" aria-label="Your email">
      <textarea name="message" required placeholder="How can we help?" aria-label="Message"></textarea>
      <button class="btn btn-solid" type="submit">Send message</button>
      <div id="cmsg" role="status"></div>
    </form>
  </div></section>
</main>
<script src="js/config.js"></script><script src="js/sample-data.js"></script><script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/pages.js"></script>
</body>
</html>
