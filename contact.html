<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact</title>
<meta name="description" content="Get in touch.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<main>
  <div class="page-hero wrap"><h1 style="font-size:clamp(2.1rem,4.6vw,3.4rem)">Contact us</h1><p class="lead">Questions, corrections or partnership ideas? Send a note.</p></div>
  <section style="padding-top:12px"><div class="wrap" style="max-width:640px">
    <p class="empty" id="cnotice" hidden style="text-align:left">The contact form is not connected yet. Paste your Apps Script web app link into <code>submitUrl</code> in <code>js/config.js</code>. Until then, use the details in the footer.</p>
    <form class="stack" id="cform">
      <input name="name" required maxlength="80" placeholder="Your name" aria-label="Your name" autocomplete="name">
      <input name="email" type="email" required maxlength="160" placeholder="Your email" aria-label="Your email" autocomplete="email">
      <textarea name="message" required minlength="10" maxlength="2000" placeholder="How can we help?" aria-label="Message"></textarea>
      <input name="company_site" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <button class="btn btn-solid" type="submit" id="cbtn">Send message</button>
      <div id="cmsg" class="smsg" role="status"></div>
    </form>
  </div></section>
</main>
<script src="js/config.js"></script><script src="js/sample-data.js"></script><script src="js/data.js"></script><script src="js/layout.js"></script><script src="js/pages.js"></script>
</body>
</html>
